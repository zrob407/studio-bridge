<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Studio Bridge Pro">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1633"/>
      <stop offset="1" stop-color="#1a2f63"/>
    </linearGradient>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27407a"/>
      <stop offset="1" stop-color="#0c1430"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd8ff"/>
      <stop offset="1" stop-color="#7f9cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.35" stop-color="#ffd166"/>
      <stop offset="0.7" stop-color="#e0a82e"/>
      <stop offset="1" stop-color="#a8761a"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#8f6212"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="badge">
      <rect x="0" y="0" width="300" height="130" rx="30"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ffd166" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <circle cx="1320" cy="130" r="420" fill="url(#halo)"/>
  <circle cx="330" cy="760" r="380" fill="url(#halo)"/>

  <g stroke="#4fd8ff" stroke-opacity="0.12" stroke-width="2" fill="none">
    <path d="M0 700 H1600"/>
    <path d="M0 740 H1600"/>
    <path d="M0 780 H1600"/>
    <path d="M0 820 H1600"/>
  </g>

  <g transform="translate(110 190) scale(1.15)" filter="url(#soft)">
    <rect width="512" height="512" rx="112" fill="url(#background)"/>
    <circle cx="256" cy="98" r="82" fill="url(#glow)"/>
    <g stroke="url(#cable)" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M146 156 L60 326"/>
      <path d="M366 156 L452 326"/>
      <path d="M190 230 V326"/>
      <path d="M223 262 V326"/>
      <path d="M256 272 V326"/>
      <path d="M289 262 V326"/>
      <path d="M322 230 V326"/>
    </g>
    <path d="M146 156 Q256 388 366 156" stroke="url(#cable)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <rect x="130" y="146" width="32" height="200" rx="8" fill="#f4f7ff"/>
    <rect x="350" y="146" width="32" height="200" rx="8" fill="#f4f7ff"/>
    <rect x="48" y="326" width="416" height="28" rx="9" fill="#dfe7fb"/>
    <rect x="48" y="354" width="416" height="8" rx="4" fill="#4fd8ff" opacity="0.55"/>
    <path d="M256 50 L267 85 L302 98 L267 111 L256 146 L245 111 L210 98 L245 85 Z" fill="#ffd166"/>
  </g>

  <text x="764" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="700" fill="#f4f7ff">Studio Bridge</text>

  <g transform="translate(766 440)" filter="url(#goldGlow)">
    <g clip-path="url(#badge)">
      <rect width="300" height="130" fill="url(#gold)"/>
      <rect x="60" y="0" width="150" height="130" fill="url(#shine)" transform="skewX(-20)" opacity="0.9"/>
    </g>
    <rect x="4" y="4" width="292" height="122" rx="27" fill="none" stroke="url(#goldEdge)" stroke-width="4"/>
    <rect x="14" y="14" width="272" height="102" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="150" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="10" fill="#3b2a05">PRO</text>
    <path d="M24 34 L30 50 L46 56 L30 62 L24 78 L18 62 L2 56 L18 50 Z" fill="#fff6d0" opacity="0.9" transform="translate(6 -14) scale(0.7)"/>
  </g>

  <text x="1100" y="535" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#9fb4ea">Add-on packs</text>
  <text x="1100" y="585" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#9fb4ea">for any MCP-ready AI</text>

  <text x="766" y="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" fill="#4fd8ff">One license key  ·  Works inside Roblox Studio</text>
</svg>
