name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}. Bump the version first."
            exit 1
          fi

      - name: Install build tools
        shell: bash
        run: npm ci

      - name: Check syntax
        shell: bash
        run: |
          for file in server.mjs assets.mjs audit.mjs png.mjs ws.mjs paths.mjs cli.mjs updater.mjs install.mjs build/build.mjs; do
            node --check "$file"
          done

      - name: Run tests
        shell: bash
        run: npm test

      - name: Build the exe
        shell: bash
        run: npm run build

      - name: Test the exe
        shell: bash
        run: |
          node test/cli.test.mjs dist/studio-bridge.exe
          node test/serve.test.mjs dist/studio-bridge.exe
          node test/update.test.mjs dist/studio-bridge.exe
          node test/autoupdate.test.mjs dist/studio-bridge.exe
          node test/sdk-client.test.mjs dist/studio-bridge.exe

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          cp dist/studio-bridge.exe "dist/studio-bridge-${version}.exe"
          7z a -tzip "dist/studio-bridge-${version}-source.zip" \
            server.mjs assets.mjs audit.mjs png.mjs ws.mjs paths.mjs cli.mjs updater.mjs install.mjs screenshot.ps1 \
            tools.json plugin.template.lua plugin.stub.lua package.json package-lock.json handlers build test README.md LICENSE THIRD_PARTY_NOTICES.txt

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum "studio-bridge-${GITHUB_REF_NAME}.exe" "studio-bridge-${GITHUB_REF_NAME}-source.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/studio-bridge-*.exe
            dist/studio-bridge-*-source.zip

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/studio-bridge-${GITHUB_REF_NAME}.exe" "dist/studio-bridge-${GITHUB_REF_NAME}-source.zip" dist/SHA256SUMS.txt --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set, so the npm package was not published."
            exit 0
          fi
          npm publish --provenance --access public
