name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        shell: bash
        run: |
          for file in server.mjs assets.mjs audit.mjs install.mjs png.mjs; do
            node --check "$file"
          done

      - name: Package source
        shell: bash
        run: |
          mkdir dist
          version="${GITHUB_REF_NAME}"
          7z a -tzip "dist/studio-bridge-${version}.zip" \
            server.mjs assets.mjs audit.mjs install.mjs png.mjs screenshot.ps1 \
            plugin.template.lua handlers README.md LICENSE

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
