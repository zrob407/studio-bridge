name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Studio Bridge version
      description: Output of `studio-bridge version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [npm, exe, source]
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: AI client
      options: [Claude Code, Codex CLI, Other]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `studio-bridge doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Plugin or server log lines
      description: Lines starting with `[Studio Bridge` from Studio's output or the MCP log. Remove anything private.
      render: text
